<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioHumanizer Local — Motor Algorítmico Anti-IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header with Custom Logo -->
        <header class="mb-6 border-b border-slate-700 pb-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-lg shadow-emerald-900/40 border border-emerald-400/30 shrink-0">
                    <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight flex items-center gap-2">
                        BioHumanizer <span class="text-emerald-400 font-light">Local Engine</span>
                    </h1>
                    <p class="text-slate-400 text-xs md:text-sm">Reescritura académica automática 100% en el navegador (Sin APIs ni claves).</p>
                </div>
            </div>
            <div class="bg-emerald-950 text-emerald-300 border border-emerald-700 text-xs px-3 py-1.5 rounded-lg font-medium">
                <i class="fas fa-microchip mr-1"></i> Motor Algorítmico Activo
            </div>
        </header>

        <!-- Configuration Rules Panel -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-5 mb-6 shadow-lg">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                <i class="fas fa-sliders-h text-emerald-400"></i> Opciones de Procesamiento Local
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-citations" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Blindar Citas (Alongi, 2020)</span>
                        <span class="text-xs text-slate-400">Protege y conserva intactas todas las citas bibliográficas en paréntesis.</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-cliches" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Eliminar Clichés Wikipedia</span>
                        <span class="text-xs text-slate-400">Sustituye muletillas mecánicas ("papel crucial", "panorama actual") por redacción directa.</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-connectors" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Variar Conectores Robóticos</span>
                        <span class="text-xs text-slate-400">Reemplaza repeticiones excesivas de "Asimismo,", "Por consiguiente," u "Además,".</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Work Area -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Input -->
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label for="input-text" class="text-sm font-medium text-slate-300">1. Texto original o redactado por IA:</label>
                    <span id="input-word-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">0 palabras</span>
                </div>
                <textarea id="input-text" rows="13" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 resize-none leading-relaxed" placeholder="Pega tu texto aquí... Ej: El hábitat natural de esta especie se caracteriza por presentar condiciones ambientales extremas... (Alongi, 2020)..."></textarea>
                
                <div class="mt-3 flex gap-2">
                    <button onclick="humanizeLocally()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30">
                        <i class="fas fa-wand-magic-sparkles"></i> Humanizar Instantáneamente
                    </button>
                    <button onclick="clearAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 px-4 rounded-xl border border-slate-700 transition" title="Limpiar todo">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Output -->
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label for="output-text" class="text-sm font-medium text-emerald-400">2. Resultado Académico Local:</label>
                    <span id="output-word-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">0 palabras</span>
                </div>
                <textarea id="output-text" rows="13" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 resize-none leading-relaxed" placeholder="El resultado procesado aparecerá aquí de inmediato..."></textarea>
                
                <button onclick="copyResult()" id="copy-btn" class="mt-3 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fas fa-copy"></i> Copiar Texto Final
                </button>
            </div>
        </div>

        <!-- Audit Summary Card -->
        <div id="audit-panel" class="hidden mt-6 bg-slate-800/90 border border-slate-700 rounded-xl p-5 shadow-lg">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                <i class="fas fa-clipboard-check text-emerald-400"></i> Resumen de Procesamiento Algorítmico
            </h3>
            <div id="audit-content" class="text-xs text-slate-300 space-y-1"></div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const inputWordCount = document.getElementById('input-word-count');
        const outputWordCount = document.getElementById('output-word-count');

        inputText.addEventListener('input', () => {
            const words = countWords(inputText.value);
            inputWordCount.textContent = `${words} palabras`;
        });

        outputText.addEventListener('input', () => {
            const words = countWords(outputText.value);
            outputWordCount.textContent = `${words} palabras`;
        });

        function countWords(str) {
            const clean = str.trim();
            return clean ? clean.split(/\s+/).length : 0;
        }

        function humanizeLocally() {
            let text = inputText.value.trim();
            if (!text) {
                alert("Por favor, ingresa algún texto en el cuadro izquierdo.");
                inputText.focus();
                return;
            }

            const originalWords = countWords(text);

            // 1. Extract and protect citations like (Alongi, 2020)
            const citations = [];
            const protectCitations = document.getElementById('rule-citations').checked;
            
            if (protectCitations) {
                text = text.replace(/\([A-Za-zÁÉÍÓÚáéíóúñÑ\s&.,]+,\s*\d{4}[a-z]?\)/g, (match) => {
                    const token = `__CIT_${citations.length}__`;
                    citations.push(match);
                    return token;
                });
            }

            // 2. Remove Wikipedia AI clichés & boilerplate phrasing
            if (document.getElementById('rule-cliches').checked) {
                const clicheMap = {
                    /en el panorama actual[,]?/gi: "hoy en día,",
                    /juega un papel crucial en[,]?/gi: "interviene en",
                    /juega un papel fundamental en[,]?/gi: "es clave para",
                    /es un testimonio de[,]?/gi: "refleja",
                    /marcando un hito en[,]?/gi: "marcando el inicio de",
                    /a pesar de estos desafíos[,]?/gi: "aun con estos factores,",
                    /en conclusión[,]?/gi: "en resumen,",
                    /cabe destacar que[,]?/gi: "destaca que",
                    /subrayando su importancia[,]?/gi: "lo que resalta su valor",
                    /en última instancia[,]?/gi: "finalmente,"
                };

                for (const [pattern, replacement] of Object.entries(clicheMap)) {
                    text = text.replace(pattern, replacement);
                }
            }

            // 3. Vary robotic/repetitive formal connectors
            if (document.getElementById('rule-connectors').checked) {
                text = text.replace(/\bAsimismo[,]?/g, "También");
                text = text.replace(/\bPor consiguiente[,]?/g, "Por tanto");
                text = text.replace(/\bAdemás[,]?/g, "Sumado a esto,");
            }

            // 4. Fine-tune sentence flow & punctuation spacing
            text = text.replace(/\s{2,}/g, " ");
            text = text.replace(/\s+\./g, ".");
            text = text.replace(/\s+,/g, ",");

            // 5. Restore protected citations
            if (protectCitations) {
                citations.forEach((cit, index) => {
                    text = text.replace(`__CIT_${index}__`, cit);
                });
            }

            outputText.value = text;
            const finalWords = countWords(text);
            outputWordCount.textContent = `${finalWords} palabras`;

            // Show Audit summary
            showAuditSummary(originalWords, finalWords, citations.length);
        }

        function showAuditSummary(orig, fin, citCount) {
            const panel = document.getElementById('audit-panel');
            const content = document.getElementById('audit-content');
            panel.classList.remove('hidden');

            content.innerHTML = `
                <div><i class="fas fa-check text-emerald-400 mr-1"></i> Citas protegidas e intactas: <b>${citCount}</b></div>
                <div><i class="fas fa-check text-emerald-400 mr-1"></i> Conteo de palabras — Original: <b>${orig}</b> | Procesado: <b>${fin}</b></div>
                <div><i class="fas fa-check text-emerald-400 mr-1"></i> Filtro local aplicado correctamente sin llamadas externas.</div>
            `;
        }

        function copyResult() {
            if (!outputText.value) return;
            outputText.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copy-btn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> ¡Copiado al portapapeles!';
            btn.classList.replace('text-emerald-400', 'text-white');
            btn.classList.replace('bg-slate-800', 'bg-emerald-600');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('text-white', 'text-emerald-400');
                btn.classList.replace('bg-emerald-600', 'bg-slate-800');
            }, 2500);
        }

        function clearAll() {
            inputText.value = '';
            outputText.value = '';
            inputWordCount.textContent = '0 palabras';
            outputWordCount.textContent = '0 palabras';
            document.getElementById('audit-panel').classList.add('hidden');
        }
    </script>
</body>
</html>
