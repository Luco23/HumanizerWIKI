<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanizador Académico Anti-IA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Encabezado con Logo -->
        <header class="mb-6 border-b border-slate-700 pb-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-4">
                <!-- Logo SVG Personalizado -->
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-lg shadow-emerald-900/40 border border-emerald-400/30 shrink-0">
                    <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight flex items-center gap-2">
                        BioHumanizer <span class="text-emerald-400 font-light">AI</span>
                    </h1>
                    <p class="text-slate-400 text-xs md:text-sm">Motor de reescritura académica natural con auditoría de citas y filtro Wikipedia.</p>
                </div>
            </div>

            <!-- Configuración de API Key -->
            <div class="w-full md:w-auto flex flex-col sm:flex-row items-stretch sm:items-center gap-2 bg-slate-800/90 p-2.5 rounded-xl border border-slate-700">
                <div class="relative flex-1">
                    <i class="fas fa-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="password" id="api-key" placeholder="Pega tu Gemini API Key aquí..." class="w-full sm:w-64 bg-slate-950 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="saveApiKey()" class="bg-slate-700 hover:bg-slate-600 text-xs text-white px-3 py-1.5 rounded-lg transition font-medium">
                    Guardar Key
                </button>
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[11px] text-emerald-400 hover:underline text-center px-1" title="Obtener clave gratuita en Google AI Studio">
                    ¿No tienes Key?
                </a>
            </div>
        </header>

        <!-- Panel de Configuración (Checkboxes) -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-5 mb-6 shadow-lg">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                <i class="fas fa-sliders-h text-emerald-400"></i> Reglas Activas de Transformación
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-citations" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Blindar Citas Bibliográficas</span>
                        <span class="text-xs text-slate-400">Mantiene intactos formatos como (Alongi, 2020) sin alterar ortografía ni posición.</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-length" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Conservar Máximo de Palabras</span>
                        <span class="text-xs text-slate-400">Prohíbe resumir. Mantiene toda la densidad técnica y extensión original.</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-wiki" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Filtro Anti-Clichés (Wikipedia)</span>
                        <span class="text-xs text-slate-400">Elimina frases de IA ("panorama actual", "testimonio de", "a pesar de sus desafíos").</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-sentences" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-slate-300 block">Ritmo Humano Variable</span>
                        <span class="text-xs text-slate-400">Alterna frases cortas y directas evitando subordinadas excesivas tipo Cervantes.</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-commas" class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-slate-300 block">Conectores Naturales</span>
                        <span class="text-xs text-slate-400">Evita iniciar cada oración con "Asimismo,", "Cabe destacar," o "Por consiguiente,".</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-typos" class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-slate-300 block">Descuido Sutil de Estudiante</span>
                        <span class="text-xs text-slate-400">Omite 1 o 2 tildes menores en palabras comunes (nunca en citas ni términos científicos).</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Área de Trabajo -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Entrada -->
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label for="input-text" class="text-sm font-medium text-slate-300">1. Texto original o generado por IA:</label>
                    <span id="input-word-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">0 palabras</span>
                </div>
                <textarea id="input-text" rows="13" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 resize-none leading-relaxed" placeholder="Pega aquí tu texto... Ej: El hábitat natural de esta especie se caracteriza por presentar condiciones ambientales extremas... (Alongi, 2020)..."></textarea>
                
                <div class="mt-3 flex gap-2">
                    <button onclick="processWithGemini()" id="run-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30">
                        <i class="fas fa-bolt"></i> Humanizar Texto Ahora
                    </button>
                    <button onclick="clearAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 px-4 rounded-xl border border-slate-700 transition" title="Limpiar todo">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Salida -->
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label for="output-text" class="text-sm font-medium text-emerald-400">2. Resultado Humanizado:</label>
                    <span id="output-word-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">0 palabras</span>
                </div>
                <textarea id="output-text" rows="13" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 resize-none leading-relaxed" placeholder="Aquí aparecerá el texto reescrito listo para entregar..."></textarea>
                
                <button onclick="copyResult()" id="copy-btn" class="mt-3 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fas fa-copy"></i> Copiar Texto Final
                </button>
            </div>
        </div>

        <!-- Panel de Auditoría Automática -->
        <div id="audit-panel" class="hidden mt-6 bg-slate-800/90 border border-slate-700 rounded-xl p-5 shadow-lg">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                <i class="fas fa-clipboard-check text-emerald-400"></i> Auditoría Automática de Seguridad Post-Generación
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Tarjeta 1: Citas -->
                <div id="audit-citations-card" class="p-4 rounded-lg border bg-slate-900/80">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-semibold text-slate-300">Integridad de Citas</span>
                        <span id="audit-citations-badge" class="text-xs font-bold px-2 py-0.5 rounded"></span>
                    </div>
                    <p id="audit-citations-desc" class="text-xs text-slate-400 mt-1"></p>
                </div>

                <!-- Tarjeta 2: Longitud -->
                <div id="audit-length-card" class="p-4 rounded-lg border bg-slate-900/80">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-semibold text-slate-300">Conservación de Longitud</span>
                        <span id="audit-length-badge" class="text-xs font-bold px-2 py-0.5 rounded"></span>
                    </div>
                    <p id="audit-length-desc" class="text-xs text-slate-400 mt-1"></p>
                </div>

                <!-- Tarjeta 3: Clichés Wikipedia -->
                <div id="audit-cliches-card" class="p-4 rounded-lg border bg-slate-900/80">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-semibold text-slate-300">Escáner Anti-Clichés IA</span>
                        <span id="audit-cliches-badge" class="text-xs font-bold px-2 py-0.5 rounded"></span>
                    </div>
                    <p id="audit-cliches-desc" class="text-xs text-slate-400 mt-1"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const inputWordCount = document.getElementById('input-word-count');
        const outputWordCount = document.getElementById('output-word-count');
        const apiKeyInput = document.getElementById('api-key');

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        });

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("Por favor, pega una API Key válida primero.");
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            alert("¡API Key guardada en tu navegador de forma segura!");
        }

        inputText.addEventListener('input', () => {
            const words = countWords(inputText.value);
            inputWordCount.textContent = `${words} palabras`;
        });

        outputText.addEventListener('input', () => {
            const words = countWords(outputText.value);
            outputWordCount.textContent = `${words} palabras`;
        });

        function countWords(str) {
            const clean = str.trim();
            return clean ? clean.split(/\s+/).length : 0;
        }

        function extractCitations(text) {
            const citationRegex = /\([A-Za-zÁÉÍÓÚáéíóúñÑ\s&.,]+,\s*\d{4}[a-z]?\)/g;
            return text.match(citationRegex) || [];
        }

        async function processWithGemini() {
            const apiKey = apiKeyInput.value.trim();
            const text = inputText.value.trim();

            if (!apiKey) {
                alert("⚠️ Necesitas pegar tu Gemini API Key en la parte superior derecha.");
                apiKeyInput.focus();
                return;
            }

            if (!text) {
                alert("Por favor, pega el texto que deseas humanizar en el cuadro izquierdo.");
                inputText.focus();
                return;
            }

            const runBtn = document.getElementById('run-btn');
            const originalBtnHTML = runBtn.innerHTML;
            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando y auditando...';
            outputText.value = "Reescribiendo texto con reglas anti-detección...";

            const words = countWords(text);
            const citations = extractCitations(text);

            let systemPrompt = `Actúa como un estudiante universitario real redactor de trabajos académicos. Reescribe el siguiente texto para que suene completamente natural y escrito por un humano, eliminando cualquier rastro o patrón estadístico de Inteligencia Artificial.\n\nREGLAS ESTRICTAS:\n`;

            if (document.getElementById('rule-citations').checked) {
                systemPrompt += `1. PROTECCIÓN ABSOLUTA DE CITAS: No alteres, traduzcas, elimines ni cambies de lugar ninguna cita bibliográfica entre paréntesis. `;
                if (citations.length > 0) {
                    systemPrompt += `Específicamente, debes mantener exactamente iguales: ${citations.join(', ')}.\n`;
                }
            }

            if (document.getElementById('rule-length').checked) {
                systemPrompt += `2. LONGITUD Y DENSIDAD: NO resumas el texto. Conserva toda la información técnica, los datos numéricos y mantén una extensión muy similar al original (el original tiene ${words} palabras; el resultado debe tener entre ${Math.floor(words * 0.95)} y ${Math.ceil(words * 1.08)} palabras).\n`;
            }

            if (document.getElementById('rule-wiki').checked) {
                systemPrompt += `3. FILTRO ANTI-CLICHÉS DE IA (CRITERIO WIKIPEDIA): Está estrictamente prohibido usar frases grandilocuentes, análisis superficiales al final de los párrafos o muletillas de chatbots como: "en el panorama actual", "juega un papel crucial", "papel fundamental", "es un testimonio de", "marcando un hito", "a pesar de estos desafíos", "en conclusión", "cabe destacar", "subrayando su importancia" o gerundios conclusivos vacíos.\n`;
            }

            if (document.getElementById('rule-sentences').checked) {
                systemPrompt += `4. RITMO DE REDACCIÓN HUMANA: Alterna oraciones directas y cortas con explicaciones medias. Evita encadenar demasiadas cláusulas subordinadas complejas.\n`;
            }

            if (document.getElementById('rule-commas').checked) {
                systemPrompt += `5. CONECTORES NATURALES: Evita iniciar oraciones repetidamente con "Asimismo,", "Por consiguiente,", "Además,". Usa transiciones orgánicas.\n`;
            }

            if (document.getElementById('rule-typos').checked) {
                systemPrompt += `6. IMPERFECCIÓN SUTIL: Introduce de forma muy discreta 1 o 2 omisiones leves de tilde en palabras comunes no técnicas (NUNCA en nombres científicos ni dentro de las citas bibliográficas).\n`;
            }

            systemPrompt += `\nEntrega ÚNICAMENTE el texto reescrito, sin saludos, sin introducciones ni comentarios.\n\nTEXTO ORIGINAL:\n"""\n${text}\n"""`;

            try {
                // Modelo actualizado a gemini-3.8-flash según requerimiento actual de la API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }],
                        generationConfig: {
                            temperature: 0.75
                        }
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "Error al conectar con la API de Gemini.");
                }

                const generatedText = data.candidates[0].content.parts[0].text.trim();
                outputText.value = generatedText;
                
                const finalWords = countWords(generatedText);
                outputWordCount.textContent = `${finalWords} palabras`;

                runSecurityAudit(text, generatedText, citations, words, finalWords);

            } catch (error) {
                outputText.value = `❌ Error: ${error.message}\n\nVerifica que tu API Key sea correcta y activa.`;
                document.getElementById('audit-panel').classList.add('hidden');
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = originalBtnHTML;
            }
        }

        function runSecurityAudit(originalText, finalText, originalCitations, originalWords, finalWords) {
            const auditPanel = document.getElementById('audit-panel');
            auditPanel.classList.remove('hidden');

            const citCard = document.getElementById('audit-citations-card');
            const citBadge = document.getElementById('audit-citations-badge');
            const citDesc = document.getElementById('audit-citations-desc');

            if (originalCitations.length === 0) {
                citCard.className = "p-4 rounded-lg border border-slate-700 bg-slate-900/80";
                citBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400";
                citBadge.textContent = "SIN CITAS";
                citDesc.textContent = "No se detectaron citas (Autor, Año) en el texto original.";
            } else {
                const missingCitations = originalCitations.filter(cit => !finalText.includes(cit));
                if (missingCitations.length === 0) {
                    citCard.className = "p-4 rounded-lg border border-emerald-500/40 bg-emerald-950/20";
                    citBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400";
                    citBadge.textContent = "100% INTACTAS";
                    citDesc.textContent = `Se conservaron las ${originalCitations.length} citas: ${originalCitations.join(', ')}.`;
                } else {
                    citCard.className = "p-4 rounded-lg border border-red-500/50 bg-red-950/30";
                    citBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-red-500/20 text-red-400";
                    citBadge.textContent = "ALERTA";
                    citDesc.textContent = `Faltan o se alteraron: ${missingCitations.join(', ')}.`;
                }
            }

            const lenCard = document.getElementById('audit-length-card');
            const lenBadge = document.getElementById('audit-length-badge');
            const lenDesc = document.getElementById('audit-length-desc');
            const ratio = Math.round((finalWords / originalWords) * 100);

            if (ratio >= 88 && ratio <= 115) {
                lenCard.className = "p-4 rounded-lg border border-emerald-500/40 bg-emerald-950/20";
                lenBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400";
                lenBadge.textContent = `${ratio}% CONSERVADO`;
                lenDesc.textContent = `Original: ${originalWords} pal. → Final: ${finalWords} pal.`;
            } else {
                lenCard.className = "p-4 rounded-lg border border-amber-500/50 bg-amber-950/20";
                lenBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-400";
                lenBadge.textContent = `${ratio}% VARIACIÓN`;
                lenDesc.textContent = `Original: ${originalWords} pal. → Final: ${finalWords} pal.`;
            }

            const cliCard = document.getElementById('audit-cliches-card');
            const cliBadge = document.getElementById('audit-cliches-badge');
            const cliDesc = document.getElementById('audit-cliches-desc');

            const forbiddenWords = [
                "panorama actual", "papel crucial", "papel fundamental", "testimonio de",
                "marcando un hito", "a pesar de estos desafíos", "en conclusión",
                "cabe destacar", "subrayando", "en última instancia", "evolución constante",
                "es importante señalar", "resulta fundamental"
            ];

            const lowerFinal = finalText.toLowerCase();
            const foundCliches = forbiddenWords.filter(phrase => lowerFinal.includes(phrase));

            if (foundCliches.length === 0) {
                cliCard.className = "p-4 rounded-lg border border-emerald-500/40 bg-emerald-950/20";
                cliBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400";
                cliBadge.textContent = "TEXTO LIMPIO";
                cliDesc.textContent = "Cero muletillas o clichés típicos de IA detectados.";
            } else {
                cliCard.className = "p-4 rounded-lg border border-amber-500/50 bg-amber-950/20";
                cliBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-400";
                cliBadge.textContent = `${foundCliches.length} DETECTADOS`;
                cliDesc.textContent = `Frases encontradas: "${foundCliches.join('", "')}".`;
            }
        }

        function copyResult() {
            if (!outputText.value) return;
            outputText.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copy-btn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> ¡Copiado al portapapeles!';
            btn.classList.replace('text-emerald-400', 'text-white');
            btn.classList.replace('bg-slate-800', 'bg-emerald-600');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('text-white', 'text-emerald-400');
                btn.classList.replace('bg-emerald-600', 'bg-slate-800');
            }, 2500);
        }

        function clearAll() {
            inputText.value = '';
            outputText.value = '';
            inputWordCount.textContent = '0 palabras';
            outputWordCount.textContent = '0 palabras';
            document.getElementById('audit-panel').classList.add('hidden');
        }
    </script>
</body>
</html>
