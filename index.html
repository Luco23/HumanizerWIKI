<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioHumanizer AI — Generador de Prompts Académicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Encabezado con Logo -->
        <header class="mb-6 border-b border-slate-700 pb-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-lg shadow-emerald-900/40 border border-emerald-400/30 shrink-0">
                    <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight flex items-center gap-2">
                        BioHumanizer <span class="text-emerald-400 font-light">AI</span>
                    </h1>
                    <p class="text-slate-400 text-xs md:text-sm">Generador de Prompts Maestros Anti-IA (Sin API Keys ni complicaciones).</p>
                </div>
            </div>
            <div class="bg-slate-800 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-lg font-medium">
                <i class="fas fa-shield-alt mr-1"></i> 100% Local y Sin Errores de Red
            </div>
        </header>

        <!-- Panel de Configuración de Reglas -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-5 mb-6 shadow-lg">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                <i class="fas fa-sliders-h text-emerald-400"></i> Reglas Activas para el Prompt
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-citations" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Blindar Citas Bibliográficas</span>
                        <span class="text-xs text-slate-400">Mantiene intactos formatos como (Alongi, 2020) sin alterar ortografía ni posición.</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-length" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Conservar Máximo de Palabras</span>
                        <span class="text-xs text-slate-400">Prohíbe resumir. Mantiene toda la densidad técnica y extensión original.</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-wiki" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-emerald-300 block">Filtro Anti-Clichés (Wikipedia)</span>
                        <span class="text-xs text-slate-400">Elimina frases de IA ("panorama actual", "testimonio de", "a pesar de sus desafíos").</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-sentences" checked class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-slate-300 block">Ritmo Humano Variable</span>
                        <span class="text-xs text-slate-400">Alterna frases cortas y directas evitando subordinadas excesivas tipo Cervantes.</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-commas" class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-slate-300 block">Conectores Naturales</span>
                        <span class="text-xs text-slate-400">Evita iniciar cada oración con "Asimismo,", "Cabe destacar," o "Por consiguiente,".</span>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 bg-slate-900/60 rounded-lg border border-slate-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                    <input type="checkbox" id="rule-typos" class="mt-1 accent-emerald-500 w-4 h-4">
                    <div>
                        <span class="font-medium text-sm text-slate-300 block">Descuido Sutil de Estudiante</span>
                        <span class="text-xs text-slate-400">Omite 1 o 2 tildes menores en palabras comunes (nunca en citas ni términos científicos).</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Área de Trabajo -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Entrada -->
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label for="input-text" class="text-sm font-medium text-slate-300">1. Pega tu texto original o generado por IA:</label>
                    <span id="input-word-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">0 palabras</span>
                </div>
                <textarea id="input-text" rows="13" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 resize-none leading-relaxed" placeholder="Pega aquí tu texto... Ej: El hábitat natural de esta especie se caracteriza por presentar condiciones ambientales extremas... (Alongi, 2020)..."></textarea>
                
                <div class="mt-3 flex gap-2">
                    <button onclick="generateMasterPrompt()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30">
                        <i class="fas fa-magic"></i> Generar Prompt Blindado
                    </button>
                    <button onclick="clearAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 px-4 rounded-xl border border-slate-700 transition" title="Limpiar todo">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Salida -->
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label for="output-prompt" class="text-sm font-medium text-emerald-400">2. Copia y pega este prompt en cualquier IA:</label>
                    <span id="citations-detected" class="text-xs text-amber-400 font-medium"></span>
                </div>
                <textarea id="output-prompt" rows="13" readonly class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm text-emerald-100/90 focus:outline-none resize-none font-mono leading-relaxed" placeholder="Aquí aparecerá el prompt maestro listo para copiar..."></textarea>
                
                <button onclick="copyPrompt()" id="copy-btn" class="mt-3 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fas fa-copy"></i> Copiar Prompt al Portapapeles
                </button>
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('input-text');
        const outputPrompt = document.getElementById('output-prompt');
        const inputWordCount = document.getElementById('input-word-count');
        const citationsDetected = document.getElementById('citations-detected');

        inputText.addEventListener('input', () => {
            const text = inputText.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            inputWordCount.textContent = `${words} palabras`;

            const citationRegex = /\([A-Za-zÁÉÍÓÚáéíóúñÑ\s&.,]+,\s*\d{4}[a-z]?\)/g;
            const matches = text.match(citationRegex);
            if (matches && matches.length > 0) {
                citationsDetected.textContent = `Citas detectadas: ${matches.length}`;
            } else {
                citationsDetected.textContent = '';
            }
        });

        function generateMasterPrompt() {
            const text = inputText.value.trim();
            if (!text) {
                alert("Por favor, pega primero el texto que deseas humanizar en el cuadro izquierdo.");
                inputText.focus();
                return;
            }

            const words = text.split(/\s+/).length;
            const citationRegex = /\([A-Za-zÁÉÍÓÚáéíóúñÑ\s&.,]+,\s*\d{4}[a-z]?\)/g;
            const matches = text.match(citationRegex) || [];

            let prompt = `Actúa como un estudiante universitario real redactor de trabajos académicos. Reescribe el siguiente texto para que suene completamente natural y escrito por un humano, eliminando cualquier rastro o patrón estadístico de Inteligencia Artificial.\n\nREGLAS ESTRICTAS QUE DEBES CUMPLIR:\n`;

            if (document.getElementById('rule-citations').checked) {
                prompt += `1. PROTECCIÓN ABSOLUTA DE CITAS: No alteres, traduzcas, elimines ni cambies de lugar ninguna cita bibliográfica entre paréntesis. `;
                if (matches.length > 0) {
                    prompt += `Específicamente, mantén exactamente iguales: ${matches.join(', ')}.\n`;
                } else {
                    prompt += `Mantén intacto cualquier formato de cita (Autor, Año).\n`;
                }
            }

            if (document.getElementById('rule-length').checked) {
                prompt += `2. LONGITUD Y DENSIDAD: NO resumas el texto. Debes conservar toda la información técnica, los datos numéricos y mantener una extensión aproximada de ${Math.floor(words * 0.95)} a ${Math.ceil(words * 1.05)} palabras (el original tiene ${words} palabras).\n`;
            }

            if (document.getElementById('rule-wiki').checked) {
                prompt += `3. FILTRO ANTI-CLICHÉS DE IA (CRITERIO WIKIPEDIA): Está estrictamente prohibido usar frases grandilocuentes, análisis superficiales al final de los párrafos o muletillas de chatbots como: "en el panorama actual", "juega un papel crucial/fundamental", "es un testimonio de", "marcando un hito", "a pesar de estos desafíos", "en conclusión", "cabe destacar", "subrayando su importancia" o gerundios conclusivos vacíos.\n`;
            }

            if (document.getElementById('rule-sentences').checked) {
                prompt += `4. RITMO DE REDACCIÓN HUMANA: Alterna oraciones directas y cortas con explicaciones medias. Evita encadenar demasiadas cláusulas subordinadas complejas.\n`;
            }

            if (document.getElementById('rule-commas').checked) {
                prompt += `5. CONECTORES NATURALES: Evita iniciar oraciones repetidamente con "Asimismo,", "Por consiguiente,", "Además,". Usa transiciones más orgánicas.\n`;
            }

            if (document.getElementById('rule-typos').checked) {
                prompt += `6. IMPERFECCIÓN SUTIL: Introduce de forma muy discreta 1 o 2 omisiones leves de tilde en palabras comunes no técnicas (nunca en nombres científicos ni dentro de las citas bibliográficas).\n`;
            }

            prompt += `\nEntrega ÚNICAMENTE el texto reescrito, sin saludos, sin introducciones ni comentarios finales.\n\nTEXTO A REESCRIBIR:\n"""\n${text}\n"""`;

            outputPrompt.value = prompt;
        }

        function copyPrompt() {
            if (!outputPrompt.value) {
                alert("Primero genera el prompt.");
                return;
            }
            outputPrompt.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copy-btn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> ¡Prompt copiado al portapapeles!';
            btn.classList.replace('text-emerald-400', 'text-white');
            btn.classList.replace('bg-slate-800', 'bg-emerald-600');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('text-white', 'text-emerald-400');
                btn.classList.replace('bg-emerald-600', 'bg-slate-800');
            }, 2500);
        }

        function clearAll() {
            inputText.value = '';
            outputPrompt.value = '';
            inputWordCount.textContent = '0 palabras';
            citationsDetected.textContent = '';
        }
    </script>
</body>
</html>
